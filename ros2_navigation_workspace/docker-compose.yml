version: '3.8'

services:
  ros2-full:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros2_navigation_container
    hostname: ros2-nav
    volumes:
      - ./src:/ros2_ws/src
      - ./build:/ros2_ws/build
      - ./install:/ros2_ws/install
      - ./log:/ros2_ws/log
      - ./data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/root/.Xauthority:ro
      - /Users/kedewei/Week-7-8-ROS2-Navigation:/host/Week-7-8-ROS2-Navigation:ro
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/xdg
      - LIBGL_ALWAYS_INDIRECT=1
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true
    security_opt:
      - seccomp:unconfined
    command: /bin/bash

  data-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros2_data_collector
    hostname: ros2-data
    volumes:
      - ./data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    network_mode: host
    stdin_open: true
    tty: true
    command: /bin/bash
